sprites.none=No hay packs en:\n{0}\n\nCada pack es una subcarpeta con idle.png, walk.png y demás.\nLos frames van en tira horizontal; el alto define el tamaño del frame.
sprites.loaded=Packs cargados:
sprites.readme=Cada subcarpeta de aquí es un sprite pack.\n\n    mi-mascota/\n      idle.png\n      walk.png\n      happy.png\n      ...\n\nConvención: cada PNG es una tira HORIZONTAL de frames.\nEl ALTO de la imagen es el tamaño del frame.\nUn walk.png de 128x32 son cuatro frames de 32x32.\n\nAnimaciones que usa el plugin:\n  idle, walk, sleep, happy, sad, scared, surprised, dance, fall\nLas que falten caen a idle.\n\nNo dibujes izquierda y derecha: el sprite se voltea solo.\n\npack.properties opcional junto a las imágenes:\n  name=Mi mascota\n  gen=bosque\n  fps.walk=8\n  loop.happy=false \n\nScripts para convertir spritesheets y GIFs animados:\nhttps://github.com/LuisDiazpe/pokedex-companion/tree/main/tools

