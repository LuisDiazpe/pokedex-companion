# Base bundle (English). Locale-specific files override individual keys.
#
# Keys ending in a number form a list: the reaction table picks one at random.
# A personality name inserted before the number overrides that list for one
# personality only, for example react.build.ok.LAZY.1
#
# Read as UTF-8, so accented characters can be written directly.
#
# Values that take a {0} placeholder are run through MessageFormat, where a
# literal apostrophe has to be doubled. Keys without placeholders are used
# verbatim and need no escaping.

