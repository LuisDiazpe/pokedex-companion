sprites.none=No packs found in:\n{0}\n\nEach pack is a subdirectory holding idle.png, walk.png and so on.\nFrames go in a horizontal strip; the image height sets the frame size.
sprites.loaded=Packs loaded:
sprites.readme=Each subdirectory here is a sprite pack.\n\n    my-pet/\n      idle.png\n      walk.png\n      happy.png\n      ...\n\nConvention: every PNG is a HORIZONTAL strip of frames.\nThe image HEIGHT is the frame size.\nA 128x32 walk.png is four 32x32 frames.\n\nAnimations the plugin reads:\n  idle, walk, sleep, happy, sad, scared, surprised, dance, fall\nMissing ones fall back to idle.\n\nDo not draw left and right facings: the sprite is mirrored for you.\n\nOptional pack.properties beside the images:\n  name=My Pet\n  gen=forest\n  fps.walk=8\n  loop.happy=false \n\nConversion scripts for sprite sheets and animated GIFs:\nhttps://github.com/LuisDiazpe/pokedex-companion/tree/main/tools

